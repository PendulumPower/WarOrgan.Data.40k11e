name: Build War Organ Dataset

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on-ubuntu-latest: false # (standard runner below)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pull Upstream BSData
        run: |
          echo "Cloning upstream BattleScribe data..."
          rm -rf upstream-data
          # Replace with your actual upstream BSData repository URL if different
          git clone --depth 1 https://github.com/BSData/wh40k-11e.git upstream-data
          # OR if your data is in a specific branch/repo format, adjust the clone URL above.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Clean Previous Builds
        run: |
          rm -rf Assets/MyGame
          rm -f MyGame.zip

      - name: Run Parser Script
        run: npx ts-node src/parse.ts
        env:
          INPUT_DIR: ./upstream-data
          OUTPUT_DIR: ./Assets/MyGame

      - name: Package Dataset Zip
        run: |
          cd Assets/MyGame
          zip -r ../../MyGame.zip .

      - name: Upload Dataset Artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-organ-dataset
          path: MyGame.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MyGame.zip
          tag_name: dataset-v1.${{ github.run_number }}
          name: War Organ Dataset v1.${{ github.run_number }}
          body: "Automated dataset build synced with upstream BattleScribe catalogs."
          draft: false
          prerelease: false
