name: Auto-Build 40k 11e War Organ Dataset

on:
  schedule:
    - cron: '0 4 * * *'  # Runs daily at 04:00 UTC
  workflow_dispatch:      # Allows manual trigger from GitHub UI
  push:
    branches:
      - main

jobs:
  build-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure Upstream Data Repository Exists
        run: |
          mkdir -p upstream
          if [ ! -d "upstream/bsdata/.git" ]; then
            echo "Cloning upstream BSData 11e repository..."
            rm -rf upstream/bsdata
            git clone --depth 1 https://github.com/BSData/wh40k-11e.git upstream/bsdata
          else
            echo "Updating upstream BSData 11e repository..."
            cd upstream/bsdata && git pull origin main && cd ../..
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Run Build Parser & Schema Validator
        run: |
          npm run build
          npm run validate

      - name: Package Output Folder into Zip Archive
        run: |
          cd output
          zip -r ../war-organ-dataset-11e.zip .
          cd ..

      - name: Check for Data Changes
        id: git-check
        run: |
          git status --porcelain
          if [ -z "$(git status --porcelain output/)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Updated Dataset Files Back to Repo
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ || true
          git commit -m "chore(dataset): sync latest 11e BSData updates [skip ci]" || true
          git push || true

      - name: Create GitHub Release & Upload Zip Asset
        if: steps.git-check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dataset-v.${{ github.run_number }}
          name: "War Organ 11e Dataset (Build ${{ github.run_number }})"
          files: war-organ-dataset-11e.zip
          body: "Automated daily synchronization and compilation of 11th Edition BSData for War Organ."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
