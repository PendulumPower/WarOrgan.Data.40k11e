name: Build dataset
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BSData/<40k-11e-repo>
          path: bsdata
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx tsx src/parse.ts bsdata WarOrgan.Data.BuildDataset/Assets/<YourDataset>
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet run --project WarOrgan.Data.BuildDataset -c Release
      - run: echo "ZIP=$(find WarOrgan.Data.BuildDataset -path '*Output/*.zip' | head -n1)" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: ${{ env.ZIP }}
