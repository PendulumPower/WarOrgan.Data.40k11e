name: Build War Organ Dataset

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Clean Previous Builds
        run: |
          rm -rf Assets/MyGame
          rm -f MyGame.zip

      - name: Run Parser Script
        run: npx ts-node src/parse.ts
        env:
          INPUT_DIR: ./upstream-data
          OUTPUT_DIR: ./Assets/MyGame

      - name: Package Dataset Zip
        run: |
          cd Assets/MyGame
          zip -r ../../MyGame.zip .

      - name: Upload Dataset Artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-organ-dataset
          path: MyGame.zip
