name: Build War Organ Dataset

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly update check

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Clone Upstream BSData Repository
        run: |
          git clone --depth 1 https://github.com/BSData/wh40k-10ed.git upstream-data

      - name: Run Dataset Parser Pipeline
        run: npm run build-data
        env:
          INPUT_DIR: ./upstream-data
          OUTPUT_DIR: ./Assets/MyGame

      - name: Package Dataset Zip
        run: |
          cd Assets
          zip -r ../MyGame.zip MyGame/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyGame-Dataset
          path: MyGame.zip
