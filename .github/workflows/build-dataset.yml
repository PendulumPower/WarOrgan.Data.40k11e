name: Build War Organ Dataset

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly update check

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create GitHub releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Clone Upstream BSData Repository
        run: |
          git clone --depth 1 https://github.com/BSData/wh40k-10e.git upstream-data

      - name: Run Dataset Parser Pipeline
        run: npm run build-data
        env:
          INPUT_DIR: ./upstream-data
          OUTPUT_DIR: ./Assets/MyGame

      - name: Package Dataset Zip
        run: |
          cd Assets/MyGame
          zip -r ../../MyGame.zip .

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: MyGame.zip
          tag_name: v1.${{ github.run_number }}.0
          name: Dataset Release v1.${{ github.run_number }}.0
          body: Automated dataset update compiled from upstream BSData.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
