name: Build dataset

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * *"   # daily: rebuild only if BSData/wh40k-11e has changed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dataset
  cancel-in-progress: false

env:
  DATASET_FOLDER: WH40K11e   # must match assetsFolder / defaultDatasetId in Program.cs

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.up.outputs.sha }}
      skip: ${{ steps.up.outputs.skip }}
    steps:
      - name: Find upstream commit and decide whether to build
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git ls-remote https://github.com/BSData/wh40k-11e.git refs/heads/main | cut -f1)
          if [ -z "$SHA" ]; then echo "Could not read upstream main"; exit 1; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LAST=$(gh release view --repo "${{ github.repository }}" --json body -q .body 2>/dev/null || true)
            case "$LAST" in *"$SHA"*) SKIP=true ;; esac
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Upstream: $SHA (skip=$SKIP)"

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
      # Only minor and build are used by the app; build bumps on every release.
      # Program.cs must read this variable (see notes) for it to take effect.
      DATASET_VERSION: 1.1.${{ github.run_number }}.0
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout BSData upstream (pinned to the commit found above)
        uses: actions/checkout@v4
        with:
          repository: BSData/wh40k-11e
          ref: ${{ needs.check.outputs.sha }}
          path: bsdata

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install parser dependencies
        run: npm install

      - name: Convert BSData -> War Organ assets
        run: npx tsx src/parse.ts bsdata "WarOrgan.Data.BuildDataset/Assets/${DATASET_FOLDER}"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show the assets the builder will read
        run: find "WarOrgan.Data.BuildDataset/Assets/${DATASET_FOLDER}" -maxdepth 2 | head -n 40

      - name: Validate and package (WarOrgan.Data.BuildDataset)
        run: |
          set -o pipefail
          dotnet run --project WarOrgan.Data.BuildDataset -c Release 2>&1 | tee build.log

      - name: Locate the zip
        run: |
          echo "All zips in the workspace:"
          find . -name '*.zip' -not -path './node_modules/*' -not -path './bsdata/*' || true
          ZIP=$(find . -name '*.zip' -not -path './node_modules/*' -not -path './bsdata/*' -not -path '*/obj/*' | head -n1)
          if [ -z "$ZIP" ]; then
            echo "No dataset zip produced. The builder log above/below shows why (usually validation errors):"
            echo "--- error categories (count, message with names removed) ---"
            grep -E ': ' build.log | sed -E "s/^[^:]*: //; s/'[^']*'/'...'/g" | sort | uniq -c | sort -rn | head -n 20
            echo "--- first 40 raw lines ---"
            head -n 40 build.log
            exit 1
          fi
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Built: $ZIP"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Dataset build ${{ github.run_number }}
          body: |
            Automated War Organ dataset build.
            Upstream: https://github.com/BSData/wh40k-11e (commit ${{ needs.check.outputs.sha }})
            Dataset version: ${{ env.DATASET_VERSION }}
          files: ${{ env.ZIP }}
